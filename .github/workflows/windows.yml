name: Windows source checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run build
      - run: go test ./...
      - run: node tests/project-terms-check.mjs
      - run: node tests/swarm-motion-check.mjs
      - run: node tests/framework-check.mjs
      - run: node tests/renderer-lifecycle-check.mjs
      - name: Build Windows desktop
        run: go build -tags 'desktop,production' -ldflags '-H windowsgui -s -w' -o Codex-Observatory.exe .
